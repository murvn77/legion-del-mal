name: Comunicador de la Legión

on:
  workflow_dispatch:
    inputs:
      villano: 
        description: "¿Cuál es el nombre del villano que envía el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Joker
          - Brainiac
          - Darkseid
          - Magneto

      mensaje:
        description: "Mensaje para el concejo"
        required: true
        default: "La misión ha sido completada con éxito."
      
      prioridad: 
        description: "Nivel de prioridad"
        required: true
        type: choice
        options:
          - 🟢 Normal
          - 🟡 Alta
          - 🔴 Crítica

jobs:
  transmitir_mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar el transmisor de la Legión
        run: sudo apt-get install -y cowsay

      - name: Imprimir inputs
        run: |
          echo "============================"
          echo "Transmisión interceptada"
          echo "============================"
          echo ""
          echo "De: "
          echo ""
          echo "Fecha: $(date -u +"%d/%m/%Y - %H:%M:%S UTC")"
          echo "----- Mensaje -----"
          cowsay -f eyes "${{ inputs.mensaje }}"
          echo ""
          echo "----- ${{ inputs.prioridad }} -----"
          echo "..."
