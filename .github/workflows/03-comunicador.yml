name: Comunicador de la Legión

on:
  workflow_dispatch:
    inputs:
      villano: 
        description: "¿Cuál es el nombre del villano que envía el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Joker
          - Brainiac
          - Darkseid
          - Magneto

      mensaje:
        description: "Mensaje para el concejo"
        required: true
        default: "La misión ha sido completada con éxito."
      
      prioridad: 
        description: "Nivel de prioridad"
        required: true
        type: choice
        options:
          - 🟢 Normal
          - 🟡 Alta
          - 🔴 Crítica

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Imprimir inputs
        run: |
          echo "Inputs: "
          echo: ""
          echo "Villano: ${{ inputs.villano }}"
          echo "Prioridad: ${{ inputs.prioridad }}"
          echo "Mensaje: ${{ inputs.mensaje }}"
